# ============================================================
#  Build combiné : site statique SEO (racine) + app React (/app)
#  IMPORTANT : dans l'UI Netlify, mettre "Base directory" = VIDE
#  (racine) pour que ce fichier fasse autorité.
# ============================================================
[build]
  base = ""
  publish = "dist"
  # 1) build de l'app React (assets sous /app/ grâce à vite base)
  # 2) on assemble : site/ à la racine de dist, app React sous dist/app/
  # 3) on génère les pages React publiques (HTML lisible par Google) et le noindex des routes privées
  command = "npm --prefix web install --no-audit --no-fund && npm --prefix web run build && rm -rf dist && mkdir -p dist && cp -R site/. dist/ && mkdir -p dist/app && cp -R web/dist/. dist/app/ && node web/scripts/prerender-pages.mjs"

[build.environment]
  NODE_VERSION = "22"

# ===== Routes privées (React SPA) -> coquille noindex /app/private.html =====
# Réécritures CIBLÉES (pas de /* fourre-tout) pour éviter les soft-404.
# /theme-numerologique et /theme-numerologique-gratuit sont de vrais fichiers
# générés au build : Netlify y ajoute lui-même le slash final par une 301.
[[redirects]]
  from = "/signin"
  to = "/app/private.html"
  status = 200

[[redirects]]
  from = "/signup"
  to = "/app/private.html"
  status = 200

[[redirects]]
  from = "/profile"
  to = "/app/private.html"
  status = 200

[[redirects]]
  from = "/auth/callback"
  to = "/app/private.html"
  status = 200

[[redirects]]
  from = "/reset-password"
  to = "/app/private.html"
  status = 200

# L'app technique ne doit jamais être indexée.
[[headers]]
  for = "/app/*"
  [headers.values]
    X-Robots-Tag = "noindex"
