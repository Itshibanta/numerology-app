<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Découvrez Votre Thème Numérologique | Clés Des Nombres</title>
    <meta name="description" content="Recevez votre thème numérologique personnalisé, rédigé par une numérologue certifiée en activité depuis 2013. Portrait complet, mission de vie, cycles. Dès 59,90 €." />

    <!-- Open Graph -->
    <meta property="og:title" content="Découvrez Votre Thème Numérologique | Clés Des Nombres" />
    <meta property="og:description" content="Votre thème numérologique personnalisé, rédigé par une numérologue certifiée. Portrait complet à partir de votre état civil. Dès 59,90 €." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://clesdesnombres.com/theme-numerologique/" />
    <meta property="og:site_name" content="Clés Des Nombres" />
    <meta property="og:image" content="https://clesdesnombres.com/og-image.jpg" />

    <!-- Données structurées : offre du thème (page de vente) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Product",
      "name": "Thème Numérologique Personnalisé",
      "description": "Analyse numérologique complète et personnalisée, rédigée par une numérologue certifiée à partir de votre état civil : portrait psychologique, mission de vie, cycles, défis et nombres karmiques.",
      "image": "https://clesdesnombres.com/og-image.jpg",
      "brand": { "@type": "Brand", "name": "Clés Des Nombres" },
      "offers": {
        "@type": "Offer",
        "price": "59.90",
        "priceCurrency": "EUR",
        "availability": "https://schema.org/InStock",
        "url": "https://clesdesnombres.com/theme-numerologique/"
      }
    }
    </script>

    <!-- Design system du site (servi à la racine du déploiement combiné).
         Chargé ici en <link> bloquant pour éviter le flash de page sans CSS
         (FOUC) au premier rendu des pages React. -->
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
